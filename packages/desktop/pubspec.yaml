name: desktop
description: "Happen desktop client"
publish_to: 'none'
version: 0.1.4+5
resolution: workspace

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  ai: any
  desktop_drop: ^0.9.2
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.2.4
  openai: any
  opencode: any
  macos_file_picker: ^2.0.0
  markdown: ^7.3.1
  protocol: any
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  server: any
  telemetry: any
  sqlite3: ^3.8.0
  val_highlight: ^0.1.1
  xterm2: 5.3.0
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.25.1
  flutter_local_notifications: ^22.3.3
  audioplayers: ^6.8.1
  app_badge_plus: ^1.3.5
  elk_stroke_icons: ^0.1.2
  config: any
  path: ^1.9.1
  shiki_flutter: ^1.1.0
  mermaid_flutter: ^0.3.2
  super_sliver_list: ^0.4.1

dev_dependencies:
  cross_file_io: ^1.0.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  storage: any

flutter:
  uses-material-design: true
  assets:
    - assets/app-icons/
    - assets/notifications/
    - assets/file-types/
    - assets/machine-icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Text.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-TextItalic.ttf
          style: italic
