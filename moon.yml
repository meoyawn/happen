$schema: 'https://moonrepo.dev/schemas/project.json'
language: dart
toolchains:
  default: system
tasks:
  analyze:
    description: Check Dart types and configured lint rules across the workspace
    command: dart --disable-dart-dev tool/test_isolated.dart analyze
    preset: utility
    inputs:
      - analysis_options.yaml
      - pubspec.yaml
      - pubspec.lock
      - packages/**/*
      - test/**/*
      - tool/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  check:
    description: Run all static, unit, and end-to-end checks
    command: noop
    deps:
      - '~:test-unit'
      - '~:test-e2e'
      - '~:analyze'
    preset: utility
    inputs: []
    options:
      cache: false

  build-cli:
    description: Build the single-file macOS arm64 Happen AOT CLI with embedded native libraries
    command: dart tool/build_cli.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - tool/build_cli.dart
      - tool/cli_native_bootstrap.dart
      - tool/dart2native.json
      - packages/cli/**/*
      - packages/agent/**/*
      - packages/ai/**/*
      - packages/openai/**/*
      - packages/opencode/**/*
      - packages/auth/**/*
      - packages/config/**/*
      - packages/mcp/**/*
      - packages/protocol/**/*
      - packages/server/**/*
      - packages/storage/**/*
      - packages/code_mode/**/*
      - packages/tool_runtime/**/*
      - packages/telemetry/**/*
      - third_party/quickjs/**/*
      - third_party/http/pkgs/http2/**/*
    outputs:
      - build/cli/happen
      - build/cli/build-report.json
    options:
      cache: true
      interactive: false
      shell: false
      outputStyle: stream
      mutex: happen-cli-build

  test-unit:
    description: Run source-level Dart tests without building the CLI
    command: dart --disable-dart-dev tool/test_isolated.dart run tool/test_unit.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - test/**/*
      - packages/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  test-e2e:
    description: Compare real outbound OpenAI requests and behavior against Codex
    command: dart --disable-dart-dev tool/test_isolated.dart run tool/test_e2e.dart
    preset: utility
    inputs:
      - test/contracts/**/*
      - test/fixtures/context_contract/**/*
      - tool/test_e2e.dart
      - packages/openai/catalog/models.json
    options:
      cache: false
      shell: false
      outputStyle: stream

  dev:
    description: Run one Flutter desktop using the vendored development SDK
    command: python3 packages/desktop/tool/run_flutter.py
    env:
      PATH: '$workspaceRoot/third_party/flutter/bin:$PATH'
      FLUTTER_ROOT: '$workspaceRoot/third_party/flutter'
    preset: server
    inputs: []
    options:
      envOverride: true
      interactive: true
      cache: false
      shell: false
      outputStyle: stream

  release:
    description: Build the macOS release with an unmodified latest-stable Flutter SDK
    command: dart packages/desktop/tool/build_release.dart
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  release-reinstall:
    description: Build/install the release, stopping its old process
    command: python3 packages/desktop/tool/release_macos.py
    deps:
      - '~:release'
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  reinstall-release:
    description: Alias for release-reinstall
    command: noop
    deps:
      - '~:release-reinstall'
    preset: utility
    inputs: []
    options:
      cache: false
