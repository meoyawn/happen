$schema: 'https://moonrepo.dev/schemas/project.json'
language: dart
toolchains:
  default: system
tasks:
  build-cli:
    description: Build the single-file macOS arm64 Happen AOT CLI with embedded native libraries
    command: dart tool/build_cli.dart
    preset: utility
    inputs: []
    outputs:
      - build/cli/happen
      - build/cli/build-report.json
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream
      mutex: happen-cli-build

  dev:
    description: Run one Flutter desktop in the foreground with stateful hot reload
    command: python3 packages/desktop/tool/run_flutter.py
    preset: server
    inputs: []
    options:
      interactive: true
      cache: false
      shell: false
      outputStyle: stream

  release:
    description: Build the macOS release
    command: env -C packages/desktop flutter build macos --release
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  release-reinstall:
    description: Build/install the release, stopping its old process
    command: python3 packages/desktop/tool/release_macos.py
    deps:
      - '~:release'
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  reinstall-release:
    description: Alias for release-reinstall
    command: noop
    deps:
      - '~:release-reinstall'
    preset: utility
    inputs: []
    options:
      cache: false
