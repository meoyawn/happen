$schema: 'https://moonrepo.dev/schemas/project.json'
language: dart
toolchains:
  default: system
fileGroups:
  server-dart:
    - pubspec.yaml
    - pubspec.lock
    - tool/build_server.dart
    - tool/build_server/common.dart
    - tool/build_server/embed.dart
    - tool/build_server/Dockerfile
    - tool/cli_native_bootstrap.dart
    - tool/native_contracts.dart
    - packages/{agent,ai,code_mode,config,mcp,openai,opencode,protocol,server,storage,telemetry,tool_runtime}/pubspec.yaml
    - packages/{agent,ai,code_mode,config,mcp,openai,opencode,protocol,server,storage,telemetry,tool_runtime}/{bin,catalog,lib}/**/*
  server-native:
    - pubspec.lock
    - tool/build_server/common.dart
    - tool/build_server/native.dart
    - tool/build_server/Dockerfile
    - tool/native_contracts.dart
  server-quickjs:
    - packages/code_mode/pubspec.yaml
    - packages/code_mode/hook/build.dart
    - packages/code_mode/native/*.{c,h}
    - packages/code_mode/native/quickjs/*.{c,h}
    - packages/code_mode/native/quickjs/LICENSE
tasks:
  build-server-native-sqlite:
    description: Build the Linux x64 SQLite library with its package hook
    command: dart
    args: [tool/build_server/native.dart, sqlite3, x64]
    preset: utility
    inputs:
      - '@group(server-native)'
    outputs:
      - build/server/linux-x64/native/libsqlite3.so
    options:
      cache: true
      interactive: false
      shell: false
      outputStyle: buffer-only-failure
      mergeArgs: replace
      mergeOutputs: replace
      mutex: happen-server-sqlite-x64

  build-server-native-quickjs:
    extends: build-server-native-sqlite
    description: Build the Linux x64 QuickJS library with the code_mode hook
    args: [tool/build_server/native.dart, code_mode, x64]
    inputs:
      - '@group(server-quickjs)'
    outputs:
      - build/server/linux-x64/native/libcode_mode.so
    options:
      mutex: happen-server-quickjs-x64

  build-server-native-flutter-pty:
    extends: build-server-native-sqlite
    description: Build the Linux x64 flutter_pty2 library with its package hook
    args: [tool/build_server/native.dart, flutter_pty2, x64]
    outputs:
      - build/server/linux-x64/native/libflutter_pty2.so
    options:
      mutex: happen-server-flutter-pty-x64

  build-server:
    description: Compile the Linux x64 Dart AOT server with cached native libraries
    command: dart
    args: [tool/build_server.dart, --compile, x64]
    deps:
      - target: '~:build-server-native-quickjs'
        cacheStrategy: outputs
      - target: '~:build-server-native-sqlite'
        cacheStrategy: outputs
      - target: '~:build-server-native-flutter-pty'
        cacheStrategy: outputs
    preset: utility
    inputs:
      - '@group(server-dart)'
    outputs:
      - build/server/linux-x64/happen-server
      - build/server/linux-x64/happen-server.sha256
      - build/server/linux-x64/build-report.json
    options:
      cache: true
      interactive: false
      shell: false
      outputStyle: buffer-only-failure
      mergeArgs: replace
      mergeDeps: replace
      mergeOutputs: replace
      mutex: happen-server-build-x64

  build-server-native-sqlite-arm64:
    extends: build-server-native-sqlite
    description: Build the Linux arm64 SQLite library with its package hook
    args: [tool/build_server/native.dart, sqlite3, arm64]
    outputs:
      - build/server/linux-arm64/native/libsqlite3.so
    options:
      mutex: happen-server-sqlite-arm64

  build-server-native-quickjs-arm64:
    extends: build-server-native-quickjs
    description: Build the Linux arm64 QuickJS library with the code_mode hook
    args: [tool/build_server/native.dart, code_mode, arm64]
    outputs:
      - build/server/linux-arm64/native/libcode_mode.so
    options:
      mutex: happen-server-quickjs-arm64

  build-server-native-flutter-pty-arm64:
    extends: build-server-native-flutter-pty
    description: Build the Linux arm64 flutter_pty2 library with its package hook
    args: [tool/build_server/native.dart, flutter_pty2, arm64]
    outputs:
      - build/server/linux-arm64/native/libflutter_pty2.so
    options:
      mutex: happen-server-flutter-pty-arm64

  build-server-arm64:
    extends: build-server
    description: Compile the Linux arm64 Dart AOT server with cached native libraries
    args: [tool/build_server.dart, --compile, arm64]
    deps:
      - target: '~:build-server-native-quickjs-arm64'
        cacheStrategy: outputs
      - target: '~:build-server-native-sqlite-arm64'
        cacheStrategy: outputs
      - target: '~:build-server-native-flutter-pty-arm64'
        cacheStrategy: outputs
    outputs:
      - build/server/linux-arm64/happen-server
      - build/server/linux-arm64/happen-server.sha256
      - build/server/linux-arm64/build-report.json
    options:
      mutex: happen-server-build-arm64

  deploy-server:
    description: Deploy the cached Linux server to the private local target and restart its daemon
    command: dart tool/deploy_server.dart --skip-build --architecture=x64
    deps:
      - target: '~:build-server'
        cacheStrategy: outputs
    preset: utility
    inputs:
      - tool/deploy_server.dart
      - tool/build_server/common.dart
      - file: .local/deploy-server.json
        optional: true
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  analyze:
    description: Check Dart types and configured lint rules across the workspace
    command: dart --disable-dart-dev tool/test_isolated.dart analyze
    preset: utility
    inputs:
      - analysis_options.yaml
      - pubspec.yaml
      - pubspec.lock
      - packages/**/*
      - test/**/*
      - tool/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  check:
    description: Run all static, unit, and end-to-end checks
    command: noop
    deps:
      - '~:test-unit'
      - '~:test-e2e'
      - '~:analyze'
    preset: utility
    inputs: []
    options:
      cache: false

  build-cli:
    description: Build the single-file macOS arm64 Happen AOT CLI with embedded native libraries
    command: dart tool/build_cli.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - tool/build_cli.dart
      - tool/cli_native_bootstrap.dart
      - tool/native_contracts.dart
      - tool/dart2native.json
      - packages/cli/**/*
      - packages/agent/**/*
      - packages/ai/**/*
      - packages/openai/**/*
      - packages/opencode/**/*
      - packages/auth/**/*
      - packages/config/**/*
      - packages/mcp/**/*
      - packages/protocol/**/*
      - packages/server/**/*
      - packages/storage/**/*
      - packages/code_mode/**/*
      - packages/tool_runtime/**/*
      - packages/telemetry/**/*
      - third_party/quickjs/**/*
    outputs:
      - build/cli/happen
      - build/cli/build-report.json
    options:
      cache: true
      interactive: false
      shell: false
      outputStyle: stream
      mutex: happen-cli-build

  test-unit:
    description: Run source-level Dart tests without building the CLI
    command: dart --disable-dart-dev tool/test_isolated.dart run tool/test_unit.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - test/**/*
      - packages/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  test-mcp:
    description: Run focused MCP command and configuration tests in isolation
    command: dart --disable-dart-dev tool/test_isolated.dart test test/config_test.dart test/config_reload_test.dart test/mcp_inventory_test.dart test/mcp_pool_test.dart test/mcp_test.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - test/config_test.dart
      - test/config_reload_test.dart
      - test/mcp_inventory_test.dart
      - test/mcp_pool_test.dart
      - test/mcp_test.dart
      - test/fixtures/mcp_stdio.dart
      - packages/config/**/*
      - packages/mcp/**/*
      - packages/server/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  test-e2e:
    description: Compare real outbound OpenAI requests and behavior against Codex
    command: dart --disable-dart-dev tool/test_isolated.dart run tool/test_e2e.dart
    preset: utility
    inputs:
      - test/contracts/**/*
      - test/fixtures/context_contract/**/*
      - tool/test_e2e.dart
      - packages/openai/catalog/models.json
    options:
      cache: false
      shell: false
      outputStyle: stream

  dev:
    description: Run one Flutter desktop using the vendored development SDK
    command: dart --disable-dart-dev packages/desktop/tool/run_flutter.dart
    env:
      PATH: '$workspaceRoot/third_party/flutter/bin:$PATH'
      FLUTTER_ROOT: '$workspaceRoot/third_party/flutter'
    preset: server
    inputs: []
    options:
      envOverride: true
      interactive: true
      cache: false
      shell: false
      outputStyle: stream

  release-native-source:
    description: Fetch the QuickJS source needed by macOS releases
    command: git submodule update --init --depth 1 packages/code_mode/native/quickjs
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release:
    description: Build a certificate-signed macOS release with Flutter and Dart
    command: dart --disable-dart-dev packages/desktop/tool/build_release.dart
    deps:
      - '~:release-native-source'
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release-dmg:
    description: Notarize the macOS release and package a DMG
    command: dart --disable-dart-dev packages/desktop/tool/package_macos.dart
    deps:
      - '~:release'
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release-notary-log:
    description: Show Apple notarization issues for a submission ID
    command: dart --disable-dart-dev packages/desktop/tool/package_macos.dart --notary-log
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release-ci-signing-setup:
    description: Import Developer ID credentials into a temporary CI keychain
    command: dart --disable-dart-dev packages/desktop/tool/ci_signing.dart setup
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release-ci-signing-cleanup:
    description: Remove the temporary CI signing keychain
    command: dart --disable-dart-dev packages/desktop/tool/ci_signing.dart cleanup
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release-publish:
    description: Upload the notarized DMG to a commit-specific GitHub release
    command: dart --disable-dart-dev packages/desktop/tool/publish_release.dart
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  release-reinstall:
    description: Build/install the release, stopping its old process
    command: dart --disable-dart-dev packages/desktop/tool/release_macos.dart
    deps:
      - '~:release'
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      runInCI: false
      outputStyle: stream

  reinstall-release:
    description: Alias for release-reinstall
    command: noop
    deps:
      - '~:release-reinstall'
    preset: utility
    inputs: []
    options:
      cache: false
