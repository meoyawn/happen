$schema: 'https://moonrepo.dev/schemas/project.json'
language: dart
toolchains:
  default: system
fileGroups:
  server-build:
    - pubspec.yaml
    - pubspec.lock
    - tool/build_server.dart
    - tool/build_server/**/*
    - tool/cli_native_bootstrap.dart
    - packages/{agent,ai,code_mode,config,mcp,openai,opencode,protocol,server,storage,telemetry,tool_runtime}/pubspec.yaml
    - packages/{agent,ai,code_mode,config,mcp,openai,opencode,protocol,server,storage,telemetry,tool_runtime}/{bin,catalog,hook,lib}/**/*
    - packages/code_mode/native/*.{c,h}
    - packages/code_mode/native/quickjs/*.{c,h}
    - packages/code_mode/native/quickjs/LICENSE
tasks:
  build-server:
    description: Build the Linux x64 AOT server with embedded native libraries
    command: dart tool/build_server.dart x64
    preset: utility
    inputs:
      - '@group(server-build)'
    outputs:
      - build/server/linux-x64/happen-server
      - build/server/linux-x64/happen-server.sha256
      - build/server/linux-x64/build-report.json
    options:
      cache: true
      interactive: false
      shell: false
      outputStyle: buffer-only-failure
      mutex: happen-server-build-x64

  deploy-server:
    description: Deploy the cached Linux server to the private local target and restart its daemon
    command: dart tool/deploy_server.dart --skip-build --architecture=x64
    deps:
      - '~:build-server'
    preset: utility
    inputs: []
    options:
      cache: false
      shell: false
      outputStyle: stream

  analyze:
    description: Check Dart types and configured lint rules across the workspace
    command: dart --disable-dart-dev tool/test_isolated.dart analyze
    preset: utility
    inputs:
      - analysis_options.yaml
      - pubspec.yaml
      - pubspec.lock
      - packages/**/*
      - test/**/*
      - tool/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  check:
    description: Run all static, unit, and end-to-end checks
    command: noop
    deps:
      - '~:test-unit'
      - '~:test-e2e'
      - '~:analyze'
    preset: utility
    inputs: []
    options:
      cache: false

  build-cli:
    description: Build the single-file macOS arm64 Happen AOT CLI with embedded native libraries
    command: dart tool/build_cli.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - tool/build_cli.dart
      - tool/cli_native_bootstrap.dart
      - tool/dart2native.json
      - packages/cli/**/*
      - packages/agent/**/*
      - packages/ai/**/*
      - packages/openai/**/*
      - packages/opencode/**/*
      - packages/auth/**/*
      - packages/config/**/*
      - packages/mcp/**/*
      - packages/protocol/**/*
      - packages/server/**/*
      - packages/storage/**/*
      - packages/code_mode/**/*
      - packages/tool_runtime/**/*
      - packages/telemetry/**/*
      - third_party/quickjs/**/*
    outputs:
      - build/cli/happen
      - build/cli/build-report.json
    options:
      cache: true
      interactive: false
      shell: false
      outputStyle: stream
      mutex: happen-cli-build

  test-unit:
    description: Run source-level Dart tests without building the CLI
    command: dart --disable-dart-dev tool/test_isolated.dart run tool/test_unit.dart
    preset: utility
    inputs:
      - pubspec.yaml
      - pubspec.lock
      - test/**/*
      - packages/**/*
    options:
      cache: false
      shell: false
      outputStyle: stream

  test-e2e:
    description: Compare real outbound OpenAI requests and behavior against Codex
    command: dart --disable-dart-dev tool/test_isolated.dart run tool/test_e2e.dart
    preset: utility
    inputs:
      - test/contracts/**/*
      - test/fixtures/context_contract/**/*
      - tool/test_e2e.dart
      - packages/openai/catalog/models.json
    options:
      cache: false
      shell: false
      outputStyle: stream

  dev:
    description: Run one Flutter desktop using the vendored development SDK
    command: dart --disable-dart-dev packages/desktop/tool/run_flutter.dart
    env:
      PATH: '$workspaceRoot/third_party/flutter/bin:$PATH'
      FLUTTER_ROOT: '$workspaceRoot/third_party/flutter'
    preset: server
    inputs: []
    options:
      envOverride: true
      interactive: true
      cache: false
      shell: false
      outputStyle: stream

  release:
    description: Build the macOS release with an unmodified latest-stable Flutter SDK
    command: dart packages/desktop/tool/build_release.dart
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  release-reinstall:
    description: Build/install the release, stopping its old process
    command: dart --disable-dart-dev packages/desktop/tool/release_macos.dart
    deps:
      - '~:release'
    preset: utility
    inputs: []
    options:
      cache: false
      interactive: false
      shell: false
      outputStyle: stream

  reinstall-release:
    description: Alias for release-reinstall
    command: noop
    deps:
      - '~:release-reinstall'
    preset: utility
    inputs: []
    options:
      cache: false
